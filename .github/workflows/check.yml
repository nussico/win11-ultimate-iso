# The builder's update check looks for this job's result ("selftest") and only offers commits that passed.
name: Check
on: [push, pull_request]
jobs:
  selftest:
    name: selftest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse, ASCII, XAML and self-tests
        shell: powershell
        run: .\tests\Check.ps1
