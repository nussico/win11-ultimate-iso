name: Claude Code Review

on:
  pull_request:
    # No synchronize: the code-review plugin stops once Claude has commented, so re-runs on push never review anything.
    # Comment @claude on the PR to get later commits reviewed.
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Dependabot and fork PRs get no secrets, so the review could only fail there
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The review prompt and tools come from this plugin, so pin it too (Dependabot does not bump this ref; update it by hand)
      - name: Checkout code-review plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anthropics/claude-code
          ref: e47cc82bdbd27b5f799acd5b05fd0c29d33bb48c
          path: .review-plugins
          fetch-depth: 1
          persist-credentials: false

      # claude-code-plugins is reserved for the anthropics GitHub source, so a local copy needs another name
      - name: Rename pinned marketplace
        run: sed -i 's/"name": "claude-code-plugins"/"name": "pinned-review-plugins"/' .review-plugins/.claude-plugin/marketplace.json

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: '${{ github.workspace }}/.review-plugins'
          plugins: 'code-review@pinned-review-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

